# polygate 配置示例
# 复制为 config.yaml 后填写你自己的 Key（config.yaml 已被 .gitignore 忽略，不会泄露）
# 环境变量用 ${NAME} 引用，例如 ${DEEPSEEK_API_KEY}

# SQLite 用量持久化（留空或删除则禁用持久化）
db_path: polygate.db
# Provider 上游 Key 在 SQLite 覆盖中使用加密密文。生产环境建议设置
# POLYGATE_MASTER_KEY（32 字节以上随机值）；未设置时会生成 db_path.master-key。

# 流式请求自动注入 stream_options.include_usage（用于统计流式 token/成本）。
# 部分国产厂商（DashScope/GLM 等）可能不兼容该字段；关闭后流式 token 将记为 0。
stream_include_usage: true

# 日志保留天数（0 = 永久保留）。>0 时定期清理过旧的 calls/requests/costs，防止 SQLite 无限增长。
log_retention_days: 0

# 单次逻辑请求的容错预算（含故障切换重试）
limits:
  total_timeout: 180     # 整个请求（含重试）总超时（秒）
  max_attempts: 8        # 最多尝试 Provider × Key 候选数
  retry_backoff: 0.15    # 重试基础退避（秒），带随机抖动，指数封顶

# 客户月预算的硬预占账本（仅在 db_path 已配置时生效）。
# 请求开始前按输入体积 + 最大输出 token 估算成本上限并原子预占，
# 请求结束后按上游 usage 结算；缺少 usage 时按预占上限保守结算。
# 这是基于 pricing 的估算，不是精确 tokenizer 上界；多进程共享 SQLite 时仍会原子检查。
budget:
  default_max_output_tokens: 4096  # 请求未指定 max_tokens 时的保守输出上限
  bytes_per_token: 2.0             # 估算宽度；值越小预占越保守
  reservation_ttl: 900             # 异常中断预占的自动失效时间（秒，应大于 total_timeout）
auth:
  # 保护你的网关入口。设置后，客户端必须带请求头 Authorization: Bearer <api_key>
  api_key: "change-me"
  # /v1/usage、/v1/status、/admin 等管理端口的独立密钥（留空则复用 api_key）
  admin_key: ""
  # 虚拟 Key 在管理面板“设置”中创建，只存 SHA-256 哈希和短前缀。
  # 旧版 client_keys 明文配置会在启动时自动迁移并从覆盖中删除。
# 告警通知（可选）：熔断打开 / 配额超限时推送到 Webhook（企微 / 钉钉 / Slack 通用 JSON）
# 未配置 webhook_url 时为静默空操作，不影响业务。同一事件 cooldown 秒内只发一次。
alerting:
  webhook_url: ""   # 如 https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx
  cooldown: 300     # 去重冷却（秒）
  timeout: 5        # webhook 请求超时（秒）

# 健康检查与熔断
health:
  enabled: true
  interval: 30          # 健康检查间隔（秒）
  failure_threshold: 3  # 连续失败 N 次后熔断
  cooldown: 60          # 熔断后冷却多久进入半开探测（秒）

# Redis 分布式限流（可选）：配置后限流状态在多个网关进程间共享
# 不配置则使用进程内存限流
# redis:
#   url: redis://127.0.0.1:6379/0

# 成本记账定价（单位：每百万 token 的价格，按你的币种统一即可）
# key 为配置里的模型名，"*" 为兜底默认价
pricing:
  deepseek-chat: { input: 2, output: 8 }
  deepseek-reasoner: { input: 4, output: 16 }
  qwen-plus: { input: 0.8, output: 2 }
  glm-4-flash: { input: 0, output: 0 }
  moonshot-v1-8k: { input: 12, output: 12 }
  "*": { input: 0, output: 0 }

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    # 多 Key 自动轮询（可选，会与 api_key 合并轮换）
    api_keys: []
    timeout: 120
    # 令牌桶限流：每秒最多 rate 个请求，突发 burst（可选）
    rate_limit: { rate: 10, burst: 20 }

  qwen:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${DASHSCOPE_API_KEY}

  zhipu:
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ${ZHIPU_API_KEY}

  moonshot:
    base_url: https://api.moonshot.cn/v1
    api_key: ${MOONSHOT_API_KEY}

  openai:
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

models:
  - name: deepseek-chat
    providers:
      - { provider: deepseek, model: deepseek-chat, weight: 1 }

  - name: deepseek-reasoner
    providers:
      - { provider: deepseek, model: deepseek-reasoner }

  - name: qwen-plus
    providers:
      - { provider: qwen, model: qwen-plus }

  - name: glm-4-flash
    providers:
      - { provider: zhipu, model: glm-4-flash }

  - name: moonshot-v1-8k
    providers:
      - { provider: moonshot, model: moonshot-v1-8k }

  - name: gpt-4o-mini
    providers:
      - { provider: openai, model: gpt-4o-mini }

  # 多 Provider 故障切换示例：优先 deepseek（权重 3），失败自动切 qwen（权重 1）
  - name: chat-fallback
    # capabilities 可以写在模型级（应用到全部路由）或每个 provider 路由级。
    # 未声明 capabilities 的路由视为兼容全部请求；声明后只在满足工具/JSON/视觉等要求时使用。
    providers:
      - { provider: deepseek, model: deepseek-chat, weight: 3 }  # 可加 capabilities: [stream, tools, json]
      - { provider: qwen, model: qwen-plus, weight: 1 }         # 可加 capabilities: [stream, tools]

  # Embeddings 模型（kind: embeddings，走 /v1/embeddings 统一转发）
  - name: qwen-text-embedding-v3
    kind: embeddings
    providers:
      - { provider: qwen, model: text-embedding-v3 }

  - name: glm-embedding-3
    kind: embeddings
    providers:
      - { provider: zhipu, model: embedding-3 }

  # 语音转写模型（kind: audio，走 /v1/audio/transcriptions 统一转发）
  - name: whisper-1
    kind: audio
    providers:
      - { provider: openai, model: whisper-1 }

  - name: qwen-audio-asr
    kind: audio
    providers:
      - { provider: qwen, model: qwen-audio-asr }
