# polygate 配置示例
# 复制为 config.yaml 后填写你自己的 Key（config.yaml 已被 .gitignore 忽略，不会泄露）
# 环境变量用 ${NAME} 引用，例如 ${DEEPSEEK_API_KEY}

# SQLite 用量持久化（留空或删除则禁用持久化）
db_path: polygate.db

auth:
  # 保护你的网关入口。设置后，客户端必须带请求头 Authorization: Bearer <api_key>
  api_key: "change-me"
  # /v1/usage、/v1/status、/admin 等管理端口的独立密钥（留空则复用 api_key）
  admin_key: ""

# 健康检查与熔断
health:
  enabled: true
  interval: 30          # 健康检查间隔（秒）
  failure_threshold: 3  # 连续失败 N 次后熔断
  cooldown: 60          # 熔断后冷却多久进入半开探测（秒）

# Redis 分布式限流（可选）：配置后限流状态在多个网关进程间共享
# 不配置则使用进程内存限流
# redis:
#   url: redis://127.0.0.1:6379/0

# 成本记账定价（单位：每百万 token 的价格，按你的币种统一即可）
# key 为配置里的模型名，"*" 为兜底默认价
pricing:
  deepseek-chat: { input: 2, output: 8 }
  deepseek-reasoner: { input: 4, output: 16 }
  qwen-plus: { input: 0.8, output: 2 }
  glm-4-flash: { input: 0, output: 0 }
  moonshot-v1-8k: { input: 12, output: 12 }
  "*": { input: 0, output: 0 }

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    # 多 Key 自动轮询（可选，会与 api_key 合并轮换）
    api_keys: []
    timeout: 120
    # 令牌桶限流：每秒最多 rate 个请求，突发 burst（可选）
    rate_limit: { rate: 10, burst: 20 }

  qwen:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${DASHSCOPE_API_KEY}

  zhipu:
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ${ZHIPU_API_KEY}

  moonshot:
    base_url: https://api.moonshot.cn/v1
    api_key: ${MOONSHOT_API_KEY}

  openai:
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

models:
  - name: deepseek-chat
    providers:
      - { provider: deepseek, model: deepseek-chat, weight: 1 }

  - name: deepseek-reasoner
    providers:
      - { provider: deepseek, model: deepseek-reasoner }

  - name: qwen-plus
    providers:
      - { provider: qwen, model: qwen-plus }

  - name: glm-4-flash
    providers:
      - { provider: zhipu, model: glm-4-flash }

  - name: moonshot-v1-8k
    providers:
      - { provider: moonshot, model: moonshot-v1-8k }

  - name: gpt-4o-mini
    providers:
      - { provider: openai, model: gpt-4o-mini }

  # 多 Provider 故障切换示例：优先 deepseek（权重 3），失败自动切 qwen（权重 1）
  - name: chat-fallback
    providers:
      - { provider: deepseek, model: deepseek-chat, weight: 3 }
      - { provider: qwen, model: qwen-plus, weight: 1 }

  # Embeddings 模型（kind: embeddings，走 /v1/embeddings 统一转发）
  - name: qwen-text-embedding-v3
    kind: embeddings
    providers:
      - { provider: qwen, model: text-embedding-v3 }

  - name: glm-embedding-3
    kind: embeddings
    providers:
      - { provider: zhipu, model: embedding-3 }

  # 语音转写模型（kind: audio，走 /v1/audio/transcriptions 统一转发）
  - name: whisper-1
    kind: audio
    providers:
      - { provider: openai, model: whisper-1 }

  - name: qwen-audio-asr
    kind: audio
    providers:
      - { provider: qwen, model: qwen-audio-asr }
